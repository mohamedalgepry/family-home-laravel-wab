name: CI & Playwright Tests

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'public/build/**'
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: family_testing
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, gd, fileinfo
        coverage: none

    - name: Copy .env.example
      run: cp -n .env.example .env || true

    - name: Install Composer dependencies
      run: composer install --prefer-dist --no-interaction --no-progress

    - name: Generate App Key
      run: php artisan key:generate

    - name: Run PHP Tests
      run: php artisan test

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install Node dependencies
      run: npm ci --force

    - name: Run ESLint
      run: npm run lint

    - name: Prepare database for full build and prerender
      env:
        APP_ENV: testing
        APP_DEBUG: "false"
        APP_URL: https://familyhome-co.com
        PRERENDER_BASE_URL: https://familyhome-co.com
        DB_CONNECTION: mysql
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_DATABASE: family_testing
        DB_USERNAME: root
        DB_PASSWORD: ""
      run: |
        php artisan config:clear
        php artisan migrate:fresh --seed --force

    - name: Build Assets (client + SSR + prerender)
      env:
        APP_ENV: testing
        APP_DEBUG: "false"
        APP_URL: https://familyhome-co.com
        PRERENDER_BASE_URL: https://familyhome-co.com
        DB_CONNECTION: mysql
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_DATABASE: family_testing
        DB_USERNAME: root
        DB_PASSWORD: ""
      run: npm run build

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright tests against this checked-out build
      env:
        APP_ENV: testing
        APP_DEBUG: "false"
        APP_URL: http://127.0.0.1:8000
        DB_CONNECTION: mysql
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_DATABASE: family_testing
        DB_USERNAME: root
        DB_PASSWORD: ""
      run: npx playwright test

    - name: Upload built production assets
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: production-build-assets
        path: public/build/
        retention-days: 1

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

  publish-build-assets:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: production-build-assets
          path: public/build/

      - name: Commit verified production build assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/build
          if git diff --cached --quiet; then
            echo "No build asset changes to commit."
          else
            git commit -m "chore(build): update production assets"
            git push origin HEAD:main
          fi

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
