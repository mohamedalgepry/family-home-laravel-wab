name: CI & Playwright Tests

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'public/build/**'
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: family_testing
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, gd, fileinfo
        coverage: none

    - name: Copy .env.example
      run: cp -n .env.example .env || true

    - name: Install Composer dependencies
      run: composer install --prefer-dist --no-interaction --no-progress

    - name: Generate App Key
      run: php artisan key:generate

    - name: Run PHP Tests
      run: php artisan test

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install Node dependencies
      run: npm ci --force

    - name: Run ESLint
      run: npm run lint

    - name: Build Assets
      run: npm run build

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright tests against production smoke target
      env:
        E2E_BASE_URL: https://familyhome-co.com
      run: npx playwright test

    - name: Commit production build assets
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add public/build
        if git diff --cached --quiet; then
          echo "No build asset changes to commit."
        else
          git commit -m "chore(build): update production assets"
          git push origin HEAD:main
        fi

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
